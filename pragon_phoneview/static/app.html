  .scanlines{
    position:absolute;inset:0;z-index:1;pointer-events:none;opacity:0.25;
    background:repeating-linear-gradient(to bottom,transparent 0px,transparent 2px,rgba(0,212,255,0.04) 2px,rgba(0,212,255,0.04) 4px);
  }
  .vignette{
    position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse 80% 60% at 50% 50%,transparent 30%,rgba(0,0,0,0.7) 100%);
  }

  /* Header */
  .header{
    flex-shrink:0;display:flex;align-items:center;gap:12px;
    padding:12px 16px;border-bottom:1px solid rgba(0,212,255,0.10);
    background:rgba(10,10,15,0.92);z-index:10;position:relative;
  }
  .logo{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;letter-spacing:2px;color:var(--cyan);text-shadow:0 0 16px rgba(0,212,255,0.4);font-family:'Orbitron',sans-serif;}
  @keyframes logoSpin{to{transform:rotate(360deg);}}
  .logo-icon{
    position:relative;width:38px;height:38px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 16px rgba(0,212,255,0.35),0 0 4px rgba(0,212,255,0.5);
  }
  .logo-icon::before{
    content:'';position:absolute;inset:-2px;border-radius:50%;
    background:conic-gradient(from 0deg,var(--cyan),rgba(0,212,255,0) 30%,rgba(0,212,255,0) 70%,var(--cyan));
    animation:logoSpin 4s linear infinite;
    z-index:0;
  }
  .logo-icon::after{
    content:'';position:absolute;inset:2px;border-radius:50%;
    background:#05050a;z-index:1;
  }
  .logo-icon img{
    position:relative;z-index:2;width:calc(100% - 6px);height:calc(100% - 6px);
    border-radius:50%;object-fit:cover;object-position:center 30%;
    box-shadow:inset 0 0 8px rgba(0,0,0,0.7);
  }
  .spacer{flex:1;}
  .status{font-size:11px;font-weight:600;letter-spacing:2px;color:rgba(0,212,255,0.6);text-transform:uppercase;display:flex;align-items:center;gap:6px;}
  .status-dot{width:7px;height:7px;border-radius:50%;background:#ffc247;box-shadow:0 0 8px #ffc247;animation:pulse 1.5s infinite;}
  .status.connected .status-dot{background:var(--green);box-shadow:0 0 8px var(--green);animation:none;}
  .status.connected{color:rgba(51,255,176,0.7);}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}
  .hbtn{width:32px;height:32px;border-radius:8px;background:rgba(0,212,255,0.05);border:1px solid rgba(0,212,255,0.12);color:rgba(0,212,255,0.5);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .hbtn:hover{background:rgba(0,212,255,0.12);color:var(--cyan);}
  .hbtn:active{transform:scale(0.93);}

  /* Model pills */
  .pill-wrap{flex-shrink:0;padding:9px 16px 7px;z-index:10;position:relative;background:rgba(10,10,15,0.5);border-bottom:1px solid rgba(0,212,255,0.06);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;}
  .pill-wrap::-webkit-scrollbar{display:none;}
  .pill{flex-shrink:0;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,212,255,0.14);color:rgba(200,210,230,0.55);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all 0.18s;font-family:'Orbitron',sans-serif;white-space:nowrap;}
  .pill:active{transform:scale(0.95);}
  .pill.active{background:rgba(0,212,255,0.16);border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 12px rgba(0,212,255,0.25);}

  /* Wave */
  .wave-wrap{flex-shrink:0;padding:8px 16px 4px;z-index:10;position:relative;background:rgba(10,10,15,0.35);border-bottom:1px solid rgba(0,212,255,0.06);}
  .wave-label{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,212,255,0.4);margin-bottom:4px;text-align:center;}
  .waveform{
    display:flex;align-items:flex-end;justify-content:center;gap:3px;height:28px;
  }
  .wbar{width:8px;border-radius:0;background:linear-gradient(to top,rgba(0,212,255,0.15),rgba(0,212,255,0.7));box-shadow:0 0 6px rgba(0,212,255,0.2);transition:height 0.08s ease;min-height:3px;}

  /* Quick actions row */
  .qa-wrap{flex-shrink:0;padding:8px 16px;z-index:10;position:relative;background:rgba(10,10,15,0.35);border-bottom:1px solid rgba(0,212,255,0.06);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;}
  .qa-wrap::-webkit-scrollbar{display:none;}
  .qa-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid rgba(0,212,255,0.14);color:rgba(200,210,230,0.7);font-size:15px;cursor:pointer;transition:all 0.15s;}
  .qa-btn span{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:rgba(200,210,230,0.45);}
  .qa-btn:active{transform:scale(0.94);}
  .qa-btn.on{background:rgba(0,212,255,0.16);border-color:var(--cyan);color:var(--cyan);}
  .qa-btn.on span{color:var(--cyan);}
  .qa-btn.warn.on{background:rgba(239,68,68,0.16);border-color:var(--red);color:#fca5a5;}
  .qa-btn.warn.on span{color:#fca5a5;}

  /* Shared modal chrome (camera / draw) */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:39;opacity:0;pointer-events:none;transition:opacity 0.2s;}
  .modal-overlay.show{opacity:1;pointer-events:auto;}
  .cam-modal,.draw-modal{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;background:#05050a;transform:translateY(100%);transition:transform 0.25s ease;}
  .cam-modal.show,.draw-modal.show{transform:translateY(0);}
  .modal-head{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid rgba(0,212,255,0.1);}
  .modal-head h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-family:'Orbitron',sans-serif;}

  /* Camera */
  .cam-body{flex:1;position:relative;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .cam-body video{width:100%;height:100%;object-fit:cover;}
  .cam-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;}
  .cam-flash.flash{animation:camFlash 0.25s ease;}
  @keyframes camFlash{0%{opacity:0.85;}100%{opacity:0;}}
  .cam-controls{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:32px;padding:22px 16px calc(22px + env(safe-area-inset-bottom));background:rgba(10,10,15,0.92);}
  .cam-shutter{width:64px;height:64px;border-radius:50%;background:transparent;border:3px solid #fff;cursor:pointer;position:relative;}
  .cam-shutter::after{content:'';position:absolute;inset:5px;border-radius:50%;background:#fff;}
  .cam-shutter:active::after{background:var(--cyan);}
  .cam-flip,.cam-close{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}

  /* Drawing pad */
  .draw-body{flex:1;position:relative;background:#0c0c14;overflow:hidden;touch-action:none;}
  #drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;}
  .draw-controls{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:rgba(10,10,15,0.92);border-top:1px solid rgba(0,212,255,0.1);flex-wrap:wrap;}
  .draw-colors{display:flex;gap:7px;}
  .draw-color{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);cursor:pointer;flex-shrink:0;}
  .draw-color.active{border-color:#fff;box-shadow:0 0 0 2px rgba(0,212,255,0.5);}
  .draw-size{flex:1;min-width:70px;accent-color:var(--cyan);}
  .draw-btn{padding:8px 14px;border-radius:10px;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);color:var(--text);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
  .draw-btn.send{background:rgba(51,255,176,0.14);border-color:rgba(51,255,176,0.4);color:var(--green);}

  /* Inline image / file previews in the feed */
  .msg-img{max-width:100%;border-radius:10px;margin-top:6px;display:block;border:1px solid rgba(0,212,255,0.15);}
  .msg pre{background:rgba(0,0,0,0.4);border:1px solid rgba(0,212,255,0.12);border-radius:8px;padding:8px 10px;overflow-x:auto;margin-top:6px;font-size:12px;}
  .msg code{font-family:'SFMono-Regular',Consolas,monospace;}
  .msg :not(pre)>code{background:rgba(0,212,255,0.1);padding:1px 5px;border-radius:4px;}
  .file-card{display:flex;align-items:center;gap:10px;margin-top:4px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);text-decoration:none;color:inherit;max-width:240px;}
  .file-card .fi{font-size:18px;}
  .file-card .fn{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* Feed */
  .feed{flex:1;overflow-y:auto;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;z-index:10;position:relative;}
  .feed::-webkit-scrollbar{width:3px;}
  .feed::-webkit-scrollbar-thumb{background:rgba(0,212,255,0.15);border-radius:3px;}
  .msg{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.55;animation:pop 0.18s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(4px);}}
  .msg-a{align-self:flex-start;background:rgba(0,212,255,0.08);border:1px solid rgba(0,212,255,0.15);border-bottom-left-radius:4px;color:#a8d8e8;}
  .msg-u{align-self:flex-end;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-bottom-right-radius:4px;color:#c8d0e0;}
  .msg-sys{align-self:center;font-size:11px;color:rgba(0,212,255,0.35);padding:2px 0;background:transparent;border:none;letter-spacing:0.3px;}
  .lbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:0.45;margin-bottom:4px;}
  .msg-a .lbl{color:var(--cyan);}
  .msg-u .lbl{color:rgba(200,210,230,0.4);text-align:right;}

  /* File */
  .fmsg{align-self:flex-end;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;border-bottom-right-radius:4px;padding:10px 13px;display:flex;align-items:center;gap:10px;max-width:82%;animation:pop 0.18s ease;}
  .ficon{font-size:20px;flex-shrink:0;}
  .fmeta{flex:1;min-width:0;}
  .flbl{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;opacity:0.4;color:rgba(200,210,230,0.5);margin-bottom:3px;}
  .fname{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fsize{font-size:10px;color:rgba(200,210,230,0.4);margin-top:2px;}
  .fbarw{height:2px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:5px;overflow:hidden;}
  .fbar{height:100%;width:0%;background:var(--cyan);border-radius:2px;transition:width 0.12s linear;}
  .fst{font-size:10px;font-weight:700;letter-spacing:1px;flex-shrink:0;color:rgba(200,210,230,0.4);}
  .fst.done{color:var(--green);}

  /* Footer */
  .footer{flex-shrink:0;padding:10px 14px;border-top:1px solid rgba(0,212,255,0.08);background:rgba(10,10,15,0.95);display:flex;gap:8px;align-items:center;z-index:10;position:relative;}
  .mic{width:40px;height:40px;border-radius:10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);color:rgba(0,212,255,0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
  .mic:hover{background:rgba(0,212,255,0.12);color:var(--cyan);}
  .mic:active{transform:scale(0.93);}
  .mic.rec{background:rgba(239,68,68,0.15);border-color:rgba(239,68,68,0.4);color:var(--red);animation:mp 1s ease-in-out infinite;}
  @keyframes mp{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.7;transform:scale(0.96);}}
  .inp{flex:1;padding:10px 14px;background:rgba(255,255,255,0.03);border:1.5px solid rgba(0,212,255,0.1);border-radius:12px;color:var(--text);font-size:14px;outline:none;transition:border-color 0.15s;font-family:inherit;}
  .inp:focus{border-color:rgba(0,212,255,0.4);box-shadow:0 0 0 3px rgba(0,212,255,0.05);}
  .inp::placeholder{color:rgba(200,210,230,0.3);}
  .attach{width:40px;height:40px;border-radius:10px;background:rgba(0,212,255,0.06);border:1px solid rgba(0,212,255,0.15);color:rgba(0,212,255,0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0;}
  .attach:hover{background:rgba(0,212,255,0.12);color:var(--cyan);}
  .attach:active{transform:scale(0.93);}
  .send{padding:10px 18px;border-radius:12px;background:rgba(0,212,255,0.12);border:1px solid rgba(0,212,255,0.25);color:var(--cyan);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all 0.2s;font-family:inherit;}
  .send:hover{background:rgba(0,212,255,0.2);box-shadow:0 0 20px rgba(0,212,255,0.15);}
  .send:active{transform:scale(0.95);}

  /* Toast */
  .toast{position:absolute;top:60px;left:50%;transform:translateX(-50%) translateY(-8px);background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.3);color:var(--cyan);font-size:12px;font-weight:700;letter-spacing:1px;padding:7px 18px;border-radius:99px;opacity:0;transition:opacity 0.22s,transform 0.22s;pointer-events:none;white-space:nowrap;z-index:20;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Message timestamp */
  .ts{font-size:9px;opacity:0.35;margin-top:4px;letter-spacing:0.5px;}
  .msg-u .ts{text-align:right;}
  .msg code{background:rgba(0,212,255,0.1);border:1px solid rgba(0,212,255,0.15);border-radius:4px;padding:1px 5px;font-size:12px;font-family:'SFMono-Regular',Consolas,monospace;}

  /* Thinking indicator */
  .thinking{align-self:flex-start;display:flex;gap:4px;padding:12px 14px;}
  .tdot{width:6px;height:6px;border-radius:50%;background:var(--cyan);opacity:0.4;animation:tbounce 1.1s ease-in-out infinite;}
  .tdot:nth-child(2){animation-delay:0.15s;}
  .tdot:nth-child(3){animation-delay:0.3s;}
  @keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:0.4;}30%{transform:translateY(-4px);opacity:1;}}

  /* Wake button */
  .wake{width:32px;height:32px;border-radius:8px;background:rgba(255,194,71,0.06);border:1px solid rgba(255,194,71,0.2);color:rgba(255,194,71,0.7);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.2s;}
  .wake:hover{background:rgba(255,194,71,0.15);color:#ffc247;}
  .wake:active{transform:scale(0.93);}

  /* Slide-in panel (History / Files / Devices) */
  .panel-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:29;opacity:0;pointer-events:none;transition:opacity 0.2s;}
  .panel-overlay.show{opacity:1;pointer-events:auto;}
  .panel{position:fixed;top:0;right:0;bottom:0;width:82%;max-width:340px;background:#0c0c14;border-left:1px solid rgba(0,212,255,0.15);z-index:30;transform:translateX(100%);transition:transform 0.25s ease;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,0.5);}
  .panel.show{transform:translateX(0);}
  .panel-head{padding:16px;border-bottom:1px solid rgba(0,212,255,0.1);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);font-family:'Orbitron',sans-serif;}
  .panel-close{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.05);border:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .panel-body{flex:1;overflow-y:auto;padding:12px 16px;}
  .panel-sec-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(0,212,255,0.4);margin:14px 0 8px;}
  .panel-sec-lbl:first-child{margin-top:0;}
  .file-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);margin-bottom:6px;text-decoration:none;color:inherit;}
  .file-row .fi{font-size:16px;}
  .file-row .fn{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-row .fz{font-size:10px;color:rgba(200,210,230,0.4);flex-shrink:0;}
  .panel-empty{font-size:12px;color:rgba(200,210,230,0.35);padding:8px 2px;}
  .panel-btn{width:100%;padding:10px;border-radius:10px;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.25);color:#fca5a5;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;margin-top:4px;}
  .panel-btn:active{transform:scale(0.98);}
</style>
</head>

      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
    <input class="inp" id="inp" placeholder="Send a command…" autocomplete="off">
    <label class="attach" for="finp">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
    </label>
    <input type="file" id="finp" multiple style="display:none">

  </div>
</div>

<div class="panel-overlay" id="panelOv" onclick="closePanel()"></div>

  <div class="panel-head">
    <h3>Files &amp; Devices</h3>
    <button class="panel-close" onclick="closePanel()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="panel-sec-lbl">Shared Files</div>
    <div id="fileList"><div class="panel-empty">Loading…</div></div>
    <div class="panel-sec-lbl">This Device</div>
    <button class="panel-btn" onclick="revokeDevices()">Sign Out All Devices</button>
  </div>
</div>

<!-- Camera module -->
<div class="modal-overlay" id="camOv"></div>
<div class="cam-modal" id="camModal">
  <div class="modal-head"><h3>Camera</h3><button class="panel-close" onclick="closeCamera()">✕</button></div>
  <div class="cam-body">
    <video id="camVideo" autoplay playsinline muted></video>

<!-- Drawing pad -->
<div class="modal-overlay" id="drawOv"></div>
<div class="draw-modal" id="drawModal">
  <div class="modal-head"><h3>Drawing Pad</h3><button class="panel-close" onclick="closeDraw()">✕</button></div>
  <div class="draw-body"><canvas id="drawCanvas"></canvas></div>
  <div class="draw-controls">
    <div class="draw-colors" id="drawColors">
      <button class="draw-color active" style="background:#00d4ff" data-c="#00d4ff"></button>
      <button class="draw-color" style="background:#ffffff" data-c="#ffffff"></button>
      <button class="draw-color" style="background:#ff5c5c" data-c="#ff5c5c"></button>
      <button class="draw-color" style="background:#33ffb0" data-c="#33ffb0"></button>
      <button class="draw-color" style="background:#ffc247" data-c="#ffc247"></button>
    </div>
    <input class="draw-size" type="range" id="drawSize" min="2" max="28" value="5">
    <button class="draw-btn" onclick="clearDraw()">Clear</button>
    <button class="draw-btn send" onclick="sendDraw()">Send</button>
  </div>

<script>
(function(){
  const feed=document.getElementById('feed'),toast=document.getElementById('toast'),st=document.getElementById('st'),stt=document.getElementById('stt'),mic=document.getElementById('mic'),wave=document.getElementById('wave'),waveLbl=document.getElementById('waveLbl');
  let tt,micRec=false;
  const bars=[];
  for(let i=0;i<32;i++){const b=document.createElement('div');b.className='wbar';b.style.height='4px';wave.appendChild(b);bars.push(b);}

  // --- Ambient waveform: the bars always react to real sound the phone is
  // hearing (mic input), whether or not you're actively "recording" to send
  // to the app. Tapping the mic button only toggles whether that audio also
  // streams to the backend over /ws/phone-audio.
  let audioCtx=null,analyser=null,freqData=null,timeData=null,micStream=null,ambientSrc=null,rafId=null,idleIv=null,ambientReady=false;
  let audioWs=null,audioProcessor=null,streaming=false;
  let runningMax=8; // slow-decaying auto-gain reference so bars stay lively in quiet AND loud rooms

  function idleAnim(){
    bars.forEach(b=>{b.style.height='4px';b.style.opacity='0.35';});
  }

  function drawLive(){
    if(!analyser){rafId=null;return;}
    analyser.getByteFrequencyData(freqData);
    analyser.getByteTimeDomainData(timeData);

    // Overall loudness from the raw waveform — this reacts to ANY noise
    // (voice, claps, background hum), not just strong single frequencies,
    // which is what made the bars feel dead against real-world sound.
    let sumSq=0;
    for(let i=0;i<timeData.length;i++){
      const s=(timeData[i]-128)/128;
      sumSq+=s*s;
    }
    const rms=Math.sqrt(sumSq/timeData.length);
    const level=Math.min(1,rms*7); // boost mic-quiet signal into a usable 0..1 range

    // Auto-gain: track a slowly-decaying peak so the frequency shape stays
    // visible whether the room is quiet or the phone is right next to a speaker.
    let peak=0;
    for(let i=0;i<freqData.length;i++) if(freqData[i]>peak) peak=freqData[i];
    runningMax=Math.max(peak, runningMax*0.985, 8);
    const gain=255/runningMax;

    const n=freqData.length,step=Math.max(1,Math.floor(n/bars.length));
    bars.forEach((b,i)=>{
      const idx=Math.min(n-1,i*step);
      const shaped=(freqData[idx]*gain)/255; // 0..~1, auto-gained frequency shape
      const v=Math.max(shaped*0.8, level*0.95); // any ambient noise lifts every bar, not just its own bin
      const h=Math.max(3,Math.min(26,3+v*26));
      b.style.height=h+'px';
      b.style.opacity=0.35+Math.min(1,v)*0.65;
    });
    rafId=requestAnimationFrame(drawLive);
  }

  async function initAmbient(){
    if(ambientReady){
      if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
      return true;
    }
    try{
      micStream=await navigator.mediaDevices.getUserMedia({audio:true});
      audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      if(audioCtx.state==='suspended') await audioCtx.resume(); // autoplay policies can start it suspended
      ambientSrc=audioCtx.createMediaStreamSource(micStream);
      analyser=audioCtx.createAnalyser();
      analyser.fftSize=128;
      analyser.smoothingTimeConstant=0.35; // was 0.7 — too sluggish to read as "reacting"
      analyser.minDecibels=-90;
      analyser.maxDecibels=-10;
      freqData=new Uint8Array(analyser.frequencyBinCount);
      timeData=new Uint8Array(analyser.fftSize);
      ambientSrc.connect(analyser);
      ambientReady=true;
      if(waveLbl)waveLbl.textContent='Listening';
      if(idleIv){clearInterval(idleIv);idleIv=null;}
      if(!rafId)drawLive();
      return true;
    }catch(err){
      if(waveLbl)waveLbl.textContent='Mic unavailable';
      sy('Mic access unavailable — showing simulated motion.');
      if(!idleIv)idleIv=setInterval(idleAnim,600);
      idleAnim();
      return false;
    }
  }

  function floatToPCM16(f32){
    const out = new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){
      const s = Math.max(-1, Math.min(1, f32[i]));
      out[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
    }
    return out;
  }

  function openAudioWs(){
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    audioWs = new WebSocket(proto + '://' + location.host + '/ws/phone-audio?token=' + encodeURIComponent(pvToken));
    audioWs.binaryType = 'arraybuffer';
  }

  async function startStreaming(){
    const ok = await initAmbient();
    if(!ok) return;
    streaming = true;
    openAudioWs();
    audioProcessor = audioCtx.createScriptProcessor(2048, 1, 1);
    audioProcessor.onaudioprocess = (ev)=>{
      if(!streaming || !audioWs || audioWs.readyState !== WebSocket.OPEN) return;
      const pcm = floatToPCM16(ev.inputBuffer.getChannelData(0));
      audioWs.send(pcm.buffer);
    };
    ambientSrc.connect(audioProcessor);
    // ScriptProcessorNode only fires onaudioprocess while connected through to
    // the destination in some browsers; route it through a silent gain node
    // so mic audio streams to the backend without playing out loud locally.
    const silentGain = audioCtx.createGain();
    silentGain.gain.value = 0;
    audioProcessor.connect(silentGain);
    silentGain.connect(audioCtx.destination);
    if(waveLbl)waveLbl.textContent='Streaming to app';
  }

  function stopStreaming(){
    streaming = false;
    if(audioProcessor){audioProcessor.disconnect();audioProcessor.onaudioprocess=null;audioProcessor=null;}
    if(audioWs){audioWs.close();audioWs=null;}
    if(waveLbl)waveLbl.textContent = ambientReady ? 'Listening' : 'Motion based on voice';
  }

  initAmbient();
  document.addEventListener('touchstart',function unlockAudio(){
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  },{passive:true});
  document.addEventListener('click',function unlockAudio(){
    if(audioCtx && audioCtx.state==='suspended') audioCtx.resume();
  });

  function t(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove('show'),2800);}
  function e(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function fmt(s){
    // Light, safe markdown: escape first, then allow fenced code blocks,
    // **bold**, *italic*, `inline code`, and bare URLs.
    const blocks=[];
    let out=e(s).replace(/```([a-zA-Z0-9_+-]*)\n?([\s\S]*?)```/g,function(_,lang,code){
      blocks.push('<pre><code>'+code+'</code></pre>');
      return '\u0000'+(blocks.length-1)+'\u0000';
    });
    out=out
      .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
      .replace(/(?<!\*)\*([^*\n]+?)\*(?!\*)/g,'<em>$1</em>')
      .replace(/`([^`]+?)`/g,'<code>$1</code>')
      .replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\n/g,'<br>');
    out=out.replace(/\u0000(\d+)\u0000/g,function(_,i){return blocks[+i];});
    return out;
  }
  function imgExt(name){return /\.(png|jpe?g|gif|webp|svg)$/i.test(name||'');}
  function nowLabel(){return new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});}
  function ap(sp,tx){
    clearThinking();
    const d=document.createElement('div');d.className='msg msg-'+sp;
    d.innerHTML='<div class="lbl">'+(sp==='a'?'App':'You')+'</div>'+fmt(tx)+'<div class="ts">'+nowLabel()+'</div>';
    feed.appendChild(d);feed.scrollTop=feed.scrollHeight;
  }
  function sy(tx){clearThinking();const d=document.createElement('div');d.className='msg msg-sys';d.textContent=tx;feed.appendChild(d);feed.scrollTop=feed.scrollHeight;}

  function fileMsg(name,size){
    clearThinking();
    const d=document.createElement('div');d.className='msg msg-a';
    const url='/uploads/'+encodeURIComponent(name)+'?token='+encodeURIComponent(pvToken);
    if(imgExt(name)){
      d.innerHTML='<div class="lbl">App</div>Received <code>'+e(name)+'</code>'
        +'<a href="'+url+'" target="_blank" rel="noopener"><img class="msg-img" src="'+url+'" loading="lazy"></a>'
        +'<div class="ts">'+nowLabel()+'</div>';
    } else {
      d.innerHTML='<div class="lbl">App</div>Received a file'
        +'<a class="file-card" href="'+url+'" target="_blank" rel="noopener"><span class="fi">'+fileIcon(name)+'</span><span class="fn">'+e(name)+(size?' · '+fs(size):'')+'</span></a>'
        +'<div class="ts">'+nowLabel()+'</div>';
    }
    feed.appendChild(d);feed.scrollTop=feed.scrollHeight;
  }

  // --- Thinking indicator, shown while waiting on a reply ---
  let thinkingEl=null, thinkingTimer=null;
  function showThinking(){
    clearThinking();
    thinkingEl=document.createElement('div');
    thinkingEl.className='thinking';
    thinkingEl.innerHTML='<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
    feed.appendChild(thinkingEl);feed.scrollTop=feed.scrollHeight;
    clearTimeout(thinkingTimer);
    thinkingTimer=setTimeout(clearThinking,15000); // don't hang forever if a reply never comes
  }
  function clearThinking(){
    if(thinkingEl){thinkingEl.remove();thinkingEl=null;}
    clearTimeout(thinkingTimer);
  }

  // ── Real backend connection ─────────────────────────────────────────────
  // Everything below replaces the old placeholder that only faked a local
  // echo. It actually authenticates with the token issued by /login or
  // /auto-login and opens the live command/feed WebSocket.
  const pvToken = sessionStorage.getItem('pv_token');
  if(!pvToken){
    // No session — bounce to the pairing screen.
    location.replace('/login');
  }

  let ws=null, wsReady=false, reconnectTimer=null, reconnectDelay=1000;

  function setConnected(isUp){
    if(isUp){
      st.classList.add('connected');
      stt.textContent='Active';
    } else {
      st.classList.remove('connected');
      stt.textContent='Reconnecting';
    }
  }

  function renderServerMsg(data){
    switch(data.type){
      case 'log':
        ap(data.speaker==='user' ? 'u' : 'a', data.text);
        break;
      case 'sys':
        sy(data.text);
        break;
      case 'status':
        sy('Status: ' + data.state);
        break;
      case 'file_received':
        fileMsg(data.name, data.size);
        break;
      case 'model_changed':
        setActiveModel(data.model, false);
        break;
      default:
        if(data.text) sy(data.text);
    }
  }

  function connectWS(){
    if(!pvToken) return;
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(proto + '://' + location.host + '/ws?token=' + encodeURIComponent(pvToken));

    ws.onopen = function(){
      wsReady = true;
      reconnectDelay = 1000;
      setConnected(true);
      sy('Remote session active.');
      t('Connected');
    };

    ws.onmessage = function(ev){
      try{ renderServerMsg(JSON.parse(ev.data)); }catch(_){}
    };

    ws.onclose = function(){
      wsReady = false;
      setConnected(false);
      if(!reconnectTimer){
        sy('Connection lost — reconnecting…');
        reconnectTimer = setTimeout(function(){
          reconnectTimer = null;
          reconnectDelay = Math.min(reconnectDelay * 1.5, 10000);
          connectWS();
        }, reconnectDelay);
      }
    };

    ws.onerror = function(){ ws.close(); };
  }

  async function sendCommand(text){
    if(ws && wsReady && ws.readyState === WebSocket.OPEN){
      ws.send(JSON.stringify({type:'command', text:text}));
      return;
    }
    // Fallback if the socket isn't up yet.
    try{
      await fetch('/api/command', {
        method:'POST',
        headers:{'Content-Type':'application/json', 'Authorization':'Bearer '+pvToken},
        body: JSON.stringify({text:text})
      });
    }catch(_){
      sy('Could not reach the app — check the connection.');
    }
  }

  window.tgm=function(){micRec=!micRec;if(micRec){mic.classList.add('rec');mic.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="12" height="16" rx="2"/><line x1="12" y1="8" x2="12" y2="12"/></svg>';sy('Mic streaming — live');t('Live');startStreaming();}else{mic.classList.remove('rec');mic.innerHTML='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>';sy('Mic stream stopped.');stopStreaming();}};
  window.snd=function(){const v=document.getElementById('inp').value.trim();if(!v)return;document.getElementById('inp').value='';ap('u',v);t('Sent');sendCommand(v);showThinking();};
  document.getElementById('inp').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();snd();}});
  window.clr=function(){feed.innerHTML='';sy('Chat cleared.');t('Cleared');};

  window.wake=async function(){
    try{
      const r=await fetch('/api/wake',{method:'POST',headers:{'Authorization':'Bearer '+pvToken}});
      const d=await r.json();
      t(d && d.ok ? 'Woke the app' : 'Wake failed');
    }catch(_){ t('Could not reach the app'); }
  };

  // --- Model pills ---
  const pills = Array.from(document.querySelectorAll('.pill'));
  function setActiveModel(model, announce){
    pills.forEach(p=>p.classList.toggle('active', p.dataset.model === model));
    if(announce) t(model.charAt(0).toUpperCase()+model.slice(1)+' active');
  }
  window.selectModel=async function(model){
    setActiveModel(model, false); // optimistic UI
    try{
      const r=await fetch('/api/model',{
        method:'POST',
        headers:{'Content-Type':'application/json','Authorization':'Bearer '+pvToken},
        body:JSON.stringify({model:model})
      });
      const d=await r.json();
      if(d && d.ok){
        setActiveModel(d.model, true);
        sy('Switched to ' + d.model.charAt(0).toUpperCase()+d.model.slice(1) + '.');
      } else {
        t((d && d.error) || 'Could not switch model');
      }
    }catch(_){ t('Could not reach the app'); }
  };
  async function loadCurrentModel(){
    try{
      const r=await fetch('/api/model',{headers:{'Authorization':'Bearer '+pvToken}});
      const d=await r.json();
      if(d && d.model) setActiveModel(d.model, false);
    }catch(_){}
  }
  loadCurrentModel();

  // --- Files & Devices panel ---
  const panel=document.getElementById('panel'), panelOv=document.getElementById('panelOv'), fileList=document.getElementById('fileList');
  window.hist=function(){
    panel.classList.add('show');panelOv.classList.add('show');
    loadFiles();
  };
  window.closePanel=function(){panel.classList.remove('show');panelOv.classList.remove('show');};

  function fileIcon(name){
    const ext=(name.split('.').pop()||'').toLowerCase();
    if(['png','jpg','jpeg','gif','webp','svg'].includes(ext))return '🖼️';
    if(['mp3','wav','m4a','ogg'].includes(ext))return '🎵';
    if(['mp4','mov','webm'].includes(ext))return '🎬';
    if(['zip','tar','gz','7z'].includes(ext))return '🗜️';
    if(['pdf'].includes(ext))return '📕';
    return '📄';
  }
  async function loadFiles(){
    fileList.innerHTML='<div class="panel-empty">Loading…</div>';
    try{
      const r=await fetch('/api/files',{headers:{'Authorization':'Bearer '+pvToken}});
      const d=await r.json();
      const files=(d && d.files) || [];
      if(!files.length){fileList.innerHTML='<div class="panel-empty">No files shared yet.</div>';return;}
      fileList.innerHTML='';
      files.forEach(f=>{
        const a=document.createElement('a');
        a.className='file-row';
        a.href='/uploads/'+encodeURIComponent(f.name)+'?token='+encodeURIComponent(pvToken);
        a.target='_blank';
        a.innerHTML='<span class="fi">'+fileIcon(f.name)+'</span><span class="fn">'+e(f.name)+'</span><span class="fz">'+fs(f.size)+'</span>';
        fileList.appendChild(a);
      });
    }catch(_){
      fileList.innerHTML='<div class="panel-empty">Could not load files.</div>';
    }
  }

  window.revokeDevices=async function(){
    try{
      const r=await fetch('/api/revoke-devices',{method:'POST',headers:{'Authorization':'Bearer '+pvToken}});
      const d=await r.json();
      if(d && d.ok){
        t('Signed out '+d.revoked+' device(s)');
        localStorage.removeItem('pv_device_token');
      } else {
        t('Could not sign out devices');
      }
    }catch(_){ t('Could not reach the app'); }
  };

  function fs(b){if(b<1024)return b+' B';if(b<1024*1024)return(b/1024).toFixed(1)+' KB';return(b/1024/1024).toFixed(1)+' MB';}
  function up(f){
    const id='fc_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const c=document.createElement('div');
    c.className='fmsg';c.id=id;
    const isImg=imgExt(f.name)||(f.type||'').startsWith('image/');
    const ficon=isImg
      ?'<img src="'+URL.createObjectURL(f)+'" style="width:36px;height:36px;object-fit:cover;border-radius:8px;flex-shrink:0;">'
      :'<div class="ficon">📎</div>';
    c.innerHTML=ficon+'<div class="fmeta"><div class="flbl">Sending</div><div class="fname">'+e(f.name)+'</div><div class="fsize">'+fs(f.size)+'</div><div class="fbarw"><div class="fbar" id="'+id+'_b" style="width:100%"></div></div></div><div class="fst" id="'+id+'_s">…</div>';
    feed.appendChild(c);feed.scrollTop=feed.scrollHeight;
    const bar=document.getElementById(id+'_b'),stEl=document.getElementById(id+'_s'),lbl=c.querySelector('.flbl');
    const fd=new FormData();fd.append('file',f);
    fetch('/api/upload',{method:'POST',headers:{'Authorization':'Bearer '+pvToken},body:fd})
      .then(r=>r.json())
      .then(d=>{
        if(d && d.ok){
          if(bar)bar.style.background='#33ffb0';
          if(stEl){stEl.textContent='✓';stEl.className='fst done';}
          if(lbl)lbl.textContent='Sent';
          t('File sent!');
        } else {
          if(stEl){stEl.textContent='✗';stEl.className='fst';}
          if(lbl)lbl.textContent='Failed';
          t((d && d.error) || 'Upload failed');
        }
      })
      .catch(()=>{
        if(stEl){stEl.textContent='✗';stEl.className='fst';}
        if(lbl)lbl.textContent='Failed';
        t('Upload failed — check connection');
      });
  }
  document.getElementById('finp').addEventListener('change',function(){Array.from(this.files).forEach(up);this.value='';});

  function upBlob(blob,filename){
    up(new File([blob],filename,{type:blob.type||'application/octet-stream'}));
  }

  // --- Mute (quick-action mirror of the mic button) ---
  const qaMute=document.getElementById('qaMute');
  window.toggleMute=function(){ tgm(); };
  const _origTgm=window.tgm;
  window.tgm=function(){
    _origTgm();
    if(qaMute){
      qaMute.classList.toggle('on', micRec);
      qaMute.querySelector('.qi').textContent = micRec ? '🔴' : '🔊';
      qaMute.querySelector('span:last-child').textContent = micRec ? 'Live' : 'Mute';
    }
  };

  // ── Camera module ───────────────────────────────────────────────────────
  const camOv=document.getElementById('camOv'),camModal=document.getElementById('camModal'),
        camVideo=document.getElementById('camVideo'),camCanvas=document.getElementById('camCanvas'),
        camFlash=document.getElementById('camFlash');
  let camStream=null, camFacing='environment';

  window.openCamera=async function(){
    camOv.classList.add('show');camModal.classList.add('show');
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});
      camVideo.srcObject=camStream;
    }catch(err){
      t('Camera unavailable — check permissions');
      closeCamera();
    }
  };
  window.closeCamera=function(){
    camOv.classList.remove('show');camModal.classList.remove('show');
    if(camStream){camStream.getTracks().forEach(tr=>tr.stop());camStream=null;}
    camVideo.srcObject=null;
  };
  window.flipCamera=async function(){
    camFacing = camFacing==='environment' ? 'user' : 'environment';
    if(camStream) camStream.getTracks().forEach(tr=>tr.stop());
    try{
      camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:camFacing},audio:false});
      camVideo.srcObject=camStream;
    }catch(err){ t('Could not switch camera'); }
  };
  window.capturePhoto=function(){
    if(!camVideo.videoWidth) return;
    camCanvas.width=camVideo.videoWidth;
    camCanvas.height=camVideo.videoHeight;
    camCanvas.getContext('2d').drawImage(camVideo,0,0);
    camFlash.classList.remove('flash');void camFlash.offsetWidth;camFlash.classList.add('flash');
    camCanvas.toBlob(function(blob){
      if(!blob) return;
      upBlob(blob,'photo_'+Date.now()+'.jpg');
      t('Photo sent');
    },'image/jpeg',0.92);
    closeCamera();
  };

  // ── Drawing pad ──────────────────────────────────────────────────────────
  const drawOv=document.getElementById('drawOv'),drawModal=document.getElementById('drawModal'),
        drawCanvas=document.getElementById('drawCanvas'),drawSize=document.getElementById('drawSize'),
        drawColorsWrap=document.getElementById('drawColors');
  const dctx=drawCanvas.getContext('2d');
  let drawColor='#00d4ff', drawing=false, lastX=0, lastY=0;

  function sizeDrawCanvas(){
    const body=drawCanvas.parentElement;
    const w=body.clientWidth, h=body.clientHeight;
    // Preserve existing strokes across a resize by stamping the old bitmap back.
    const prev=drawCanvas.width?drawCanvas.toDataURL():null;
    drawCanvas.width=w;drawCanvas.height=h;
    dctx.lineCap='round';dctx.lineJoin='round';
    if(prev){const img=new Image();img.onload=()=>dctx.drawImage(img,0,0,w,h);img.src=prev;}
  }
  window.openDraw=function(){
    drawOv.classList.add('show');drawModal.classList.add('show');
    requestAnimationFrame(sizeDrawCanvas);
  };
  window.closeDraw=function(){ drawOv.classList.remove('show');drawModal.classList.remove('show'); };
  window.clearDraw=function(){ dctx.clearRect(0,0,drawCanvas.width,drawCanvas.height); };
  window.sendDraw=function(){
    drawCanvas.toBlob(function(blob){
      if(!blob) return;
      upBlob(blob,'drawing_'+Date.now()+'.png');
      t('Drawing sent');
      closeDraw();
    },'image/png');
  };
  drawColorsWrap.addEventListener('click',function(ev){
    const b=ev.target.closest('.draw-color');
    if(!b) return;
    drawColor=b.dataset.c;
    drawColorsWrap.querySelectorAll('.draw-color').forEach(x=>x.classList.toggle('active',x===b));
  });
  function drawPos(ev){
    const r=drawCanvas.getBoundingClientRect();
    const pt=(ev.touches&&ev.touches[0])||ev;
    return {x:pt.clientX-r.left, y:pt.clientY-r.top};
  }
  function drawStart(ev){
    drawing=true;const p=drawPos(ev);lastX=p.x;lastY=p.y;
    dctx.beginPath();dctx.arc(p.x,p.y,(+drawSize.value)/2,0,Math.PI*2);dctx.fillStyle=drawColor;dctx.fill();
    ev.preventDefault();
  }
  function drawMove(ev){
    if(!drawing) return;
    const p=drawPos(ev);
    dctx.strokeStyle=drawColor;dctx.lineWidth=+drawSize.value;
    dctx.beginPath();dctx.moveTo(lastX,lastY);dctx.lineTo(p.x,p.y);dctx.stroke();
    lastX=p.x;lastY=p.y;
    ev.preventDefault();
  }
  function drawEnd(){ drawing=false; }
  drawCanvas.addEventListener('pointerdown',drawStart);
  drawCanvas.addEventListener('pointermove',drawMove);
  window.addEventListener('pointerup',drawEnd);
  drawCanvas.addEventListener('touchstart',drawStart,{passive:false});
  drawCanvas.addEventListener('touchmove',drawMove,{passive:false});
  drawCanvas.addEventListener('touchend',drawEnd);
  window.addEventListener('resize',()=>{ if(drawModal.classList.contains('show')) sizeDrawCanvas(); });

  if(pvToken) connectWS();
})();
</script>
</body>
</html>
